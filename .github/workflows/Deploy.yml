name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main  # Change to your default branch if needed

permissions:
  contents: write  # Needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      # npm ci = ติดตั้งตาม package-lock.json เป๊ะ ๆ -> build ซ้ำได้ผลเดิมทุกครั้ง
      # (npm install จะขยับเวอร์ชันตาม semver range เอง ทำให้ build ที่เคยผ่านพังได้)
      - name: Install Dependencies
        run: npm ci

      # ข้อมูลไม่ได้ commit ใน git แล้ว -> กู้ชุดล่าสุดจาก cache ก่อน เผื่อ API ล่มวันนี้
      - name: Restore last good data
        uses: actions/cache@v4
        with:
          path: |
            src/data/items.json
            src/data/tasks.json
            src/data/maps.json
            src/data/hideout.json
            src/data/ammo.json
            src/data/story.json
            public/price_data.json
            public/gear_data.json
            public/optimizer_data.json
            public/loot_data.json
            public/story
          key: tarkov-data-${{ github.run_id }}
          restore-keys: tarkov-data-

      # refresh ก่อน build ทุกครั้งที่ deploy โค้ดใหม่ -> ข้อมูลใน bundle สดเสมอ
      # ถ้าแหล่งข้อมูลล่มชั่วคราว จะ build ต่อด้วยชุดที่กู้มาจาก cache (ไม่ทำให้ deploy พัง)
      - name: Refresh data
        run: npm run update-all || echo "refresh ล้มเหลว — ใช้ชุดข้อมูลจาก cache รอบก่อนแทน"

      # เติมไฟล์ที่ยังขาด (เช่น cache ว่างและ refresh ล้มบางตัว) ก่อน build
      - name: Ensure data present
        run: npm run ensure-data

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
