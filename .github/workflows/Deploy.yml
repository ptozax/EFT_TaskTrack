name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main  # Change to your default branch if needed

permissions:
  contents: write  # Needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      # npm ci = ติดตั้งตาม package-lock.json เป๊ะ ๆ -> build ซ้ำได้ผลเดิมทุกครั้ง
      # (npm install จะขยับเวอร์ชันตาม semver range เอง ทำให้ build ที่เคยผ่านพังได้)
      - name: Install Dependencies
        run: npm ci

      # refresh data ก่อน build ทุกครั้งที่ deploy โค้ดใหม่ -> bundle fallback สดเสมอ (ไม่ใช่ของเก่าที่ commit ไว้)
      # ถ้า tarkov.dev ล่มชั่วคราว จะ build ต่อด้วย data ที่ commit ไว้ (ไม่ทำให้ deploy พัง)
      - name: Refresh data from tarkov.dev
        run: npm run update-all || echo "refresh ล้มเหลว — build ด้วย data ที่ commit ไว้แทน"

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
