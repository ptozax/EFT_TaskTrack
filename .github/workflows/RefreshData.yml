name: Refresh Tarkov Data

# ดึงข้อมูลสดจาก json.tarkov.dev แล้ว build/deploy ตาม
# ข้อมูลไม่ถูก commit ลง git อีกแล้ว — ของที่ deploy สร้างใหม่ทุกรอบตรงนี้เลย
# ชุดข้อมูลรอบล่าสุดถูกเก็บใน actions/cache ไว้เป็น fallback เวลา API ล่ม
on:
  schedule:
    - cron: '0 18 * * *'      # ทุกวัน 18:00 UTC (= 01:00 เวลาไทย) — แก้ความถี่ได้ที่นี่
  workflow_dispatch: {}         # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write               # ต้องเขียน เพื่อ deploy ไป gh-pages

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22       # ต้อง 18+ (global fetch)
          cache: npm

      # npm ci = ติดตั้งตาม package-lock.json เป๊ะ ๆ -> build ซ้ำได้ผลเดิมทุกครั้ง
      - name: Install Dependencies
        run: npm ci

      # กู้ชุดข้อมูลของรอบก่อนมาก่อน เพื่อให้มีของใช้ build ต่อได้แม้ API ล่มวันนี้
      # key ไม่ซ้ำทุกรอบ + restore-keys prefix = ได้ cache ล่าสุดที่มีเสมอ
      - name: Restore last good data
        uses: actions/cache@v4
        with:
          path: |
            src/data/items.json
            src/data/tasks.json
            src/data/maps.json
            src/data/hideout.json
            src/data/ammo.json
            public/price_data.json
            public/gear_data.json
            public/optimizer_data.json
            public/loot_data.json
          key: tarkov-data-${{ github.run_id }}
          restore-keys: tarkov-data-

      # ถ้าแหล่งข้อมูลล่ม ให้ build ต่อด้วยชุดที่กู้มาจาก cache (ไม่ทำให้ deploy พัง)
      - name: Refresh data
        run: npm run update-all || echo "refresh ล้มเหลว — ใช้ชุดข้อมูลจาก cache รอบก่อนแทน"

      # กันกรณี cache ว่างและ refresh ล้มบางตัว: เติมไฟล์ที่ยังขาดให้ครบก่อน build
      - name: Ensure data present
        run: npm run ensure-data

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
