name: Refresh Tarkov Data

# ดึงข้อมูลสดจาก json.tarkov.dev มาอัปเดตไฟล์ static (fallback) ที่ commit ไว้บน git
# ให้ไม่ค้างเก่า — แล้ว build+deploy ให้ตัวที่ deploy สดตามด้วย
on:
  schedule:
    - cron: '0 18 * * *'      # ทุกวัน 18:00 UTC (= 01:00 เวลาไทย) — แก้ความถี่ได้ที่นี่
  workflow_dispatch: {}         # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write               # ต้องเขียน เพื่อ commit ข้อมูล + deploy ไป gh-pages

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22       # ต้อง 18+ (global fetch)
          cache: npm

      # npm ci = ติดตั้งตาม package-lock.json เป๊ะ ๆ -> build ซ้ำได้ผลเดิมทุกครั้ง
      - name: Install Dependencies
        run: npm ci

      # ถ้า json.tarkov.dev ล่มตอนตี 1 ให้ deploy ต่อด้วย data ที่ commit ไว้
      # (ไม่ให้ job แดงแล้วเสีย deploy ทั้งรอบ) — พฤติกรรมเดียวกับ Deploy.yml
      - name: Refresh data from tarkov.dev
        run: npm run update-all || echo "refresh ล้มเหลว — build/deploy ด้วย data ที่ commit ไว้แทน"

      - name: Commit refreshed data (ถ้ามีการเปลี่ยนแปลง)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json public/*.json
          if git diff --staged --quiet; then
            echo "ไม่มีข้อมูลเปลี่ยน — ข้าม commit"
          else
            git commit -m "chore(data): refresh tarkov data [skip ci]"
            # ถ้ามีคน push โค้ดเข้า main ระหว่าง job นี้กำลังรัน push ตรง ๆ จะถูก reject
            # -> rebase ทับของใหม่ก่อน แล้วค่อย push (ยังพลาดได้ถ้า JSON ชนกันจริง)
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
